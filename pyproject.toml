[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-cloud-finops"
version = "1.1.0"
description = "AI-powered multi-cloud cost intelligence platform (FOCUS-aligned)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Priyaranjan Sahu" }]
keywords = ["finops", "cloud-cost", "anomaly-detection", "forecasting", "rightsizing"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.1",
    "pydantic==2.7.4",
    "pandas==2.2.2",
    "numpy==1.26.4",
    "scipy==1.13.1",
    "scikit-learn==1.5.0",
    "boto3==1.34.131",
    "google-cloud-billing==1.13.1",
    "google-cloud-storage==2.17.0",
    "azure-mgmt-costmanagement==4.0.0",
    "azure-storage-blob==12.20.0",
    "azure-identity==1.16.1",
    "prometheus-client==0.20.0",
    "requests==2.32.3",
    "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.2",
    "pytest-cov==5.0.0",
    "httpx==0.27.0",
    "ruff==0.4.9",
    "mypy==1.10.0",
]

[tool.setuptools.packages.find]
include = ["finops_engine*", "scripts*", "src*"]

[tool.ruff]
line-length = 120
target-version = "py310"
exclude = ["infra", "kubernetes", "monitoring", "output"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
exclude = ["tests", "infra", "kubernetes", "monitoring", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["finops_engine"]
omit = ["finops_engine/connectors/aws_connector.py", "finops_engine/connectors/gcp_connector.py", "finops_engine/connectors/azure_connector.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true