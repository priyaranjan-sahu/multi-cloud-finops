# Deployment and Service for the Multi-Cloud FinOps API
# Apply the full stack with: kubectl apply -f kubernetes/

apiVersion: apps/v1
kind: Deployment
metadata:
  name: multi-cloud-finops-app
  namespace: default
  labels:
    app: multi-cloud-finops-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: multi-cloud-finops-app
  template:
    metadata:
      labels:
        app: multi-cloud-finops-app
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: multi-cloud-finops-app
          image: ghcr.io/priyaranjan-sahu/multi-cloud-finops:1.1.0
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: FINOP_ENVIRONMENT
              value: "production"
            - name: LOG_LEVEL
              value: "INFO"
          envFrom:
            - secretRef:
                name: finops-runtime-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: multi-cloud-finops-service
  namespace: default
spec:
  selector:
    app: multi-cloud-finops-app
  ports:
    - port: 8000
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: finops-prometheus
  namespace: default
spec:
  ports:
    - port: 9090
      name: prometheus
  selector:
    app: prometheus