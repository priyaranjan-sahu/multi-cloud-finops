# Copy to finops-runtime-config.yaml, replace every value, then apply it.
apiVersion: v1
kind: Secret
metadata:
  name: finops-runtime-config
type: Opaque
stringData:
  FINOP_API_KEY: "replace-with-a-long-random-secret"
  FINOP_CORS_ORIGINS: "https://finops.example.com"
  FINOP_AWS_ACCOUNT_ID: "123456789012"
  FINOP_AWS_REGION: "us-east-1"
  FINOP_GCP_PROJECT_ID: "your-gcp-project"
  FINOP_GCP_BILLING_TABLE: "your-gcp-project.billing.gcp_billing_export_v1"
