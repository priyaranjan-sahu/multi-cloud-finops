name: Enterprise Cross-Repo Validation

on:
  workflow_dispatch:
    inputs:
      enterprise_ref:
        description: "Enterprise repo ref (branch, tag, or SHA)"
        required: false
        default: "main"
      enterprise_repo:
        description: "Enterprise repo (owner/repo)"
        required: false
        default: "priyaranjan-sahu/multi-cloud-finops-enterprise"
  repository_dispatch:
    types: [validate-enterprise]
  pull_request:
    paths:
      - ".github/workflows/enterprise-cross-check.yml"

permissions:
  contents: read

env:
  ENTERPRISE_DIR: enterprise

jobs:
  cross-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout public repo (this repo)
        uses: actions/checkout@v4
        with:
          path: public

      - name: Checkout enterprise repo
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.enterprise_repo || 'priyaranjan-sahu/multi-cloud-finops-enterprise' }}
          ref: ${{ inputs.enterprise_ref || github.event.client_payload.enterprise_ref || 'main' }}
          token: ${{ secrets.ENTERPRISE_REPO_TOKEN }}
          path: ${{ env.ENTERPRISE_DIR }}

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: ${{ env.ENTERPRISE_DIR }}/requirements.txt

      - name: Install dependencies (enterprise)
        working-directory: ${{ env.ENTERPRISE_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint with ruff (enterprise)
        working-directory: ${{ env.ENTERPRISE_DIR }}
        run: |
          ruff check .
          ruff format --check .

      - name: Type check with mypy (enterprise)
        working-directory: ${{ env.ENTERPRISE_DIR }}
        run: mypy finops_engine

      - name: Run tests (enterprise)
        working-directory: ${{ env.ENTERPRISE_DIR }}
        run: pytest tests/ -q

      - name: Summary
        if: success()
        run: echo "Enterprise cross-check passed for ${{ inputs.enterprise_ref || github.event.client_payload.enterprise_ref || 'main' }} on Python ${{ matrix.python-version }}"
