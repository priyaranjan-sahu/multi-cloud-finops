name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject.toml version ${PYPROJECT_VERSION}" >&2
            exit 1
          fi

      - name: Extract changelog section for release notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python - "$VERSION" > release_body.md <<'EOF'
          import re
          import sys

          version = sys.argv[1]
          with open("CHANGELOG.md", encoding="utf-8") as handle:
              content = handle.read()

          match = re.search(rf"^## \[{re.escape(version)}\]\s+.*?(?=^## )", content, re.M | re.S)
          if not match:
              print(f"No CHANGELOG entry found for v{version}.", file=sys.stderr)
              sys.exit(1)
          print(match.group(0).strip())
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body_path: release_body.md
          draft: false
          prerelease: false