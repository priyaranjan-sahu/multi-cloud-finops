global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'finops-engine'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['finops-api:8000']

  # cAdvisor exposes container CPU/memory metrics used by the KEDA
  # utilization-ratio autoscaler queries (container_spec_cpu_quota, ...).
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
